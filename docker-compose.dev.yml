services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - excel-mapper-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    command: python manage.py runserver 0.0.0.0:8000
    ports:
      - "8000:8000"
    environment:
      - DEBUG=True
      - PORT=8000
      - ALLOWED_HOSTS=*
      - SECRET_KEY=your-secret-key-for-local-development
      - DATABASE_URL=sqlite:///db.sqlite3
      - CORS_ALLOWED_ORIGINS=http://localhost:3000,http://127.0.0.1:3000,http://localhost:3001,http://127.0.0.1:3001
      - REDIS_URL=redis://redis:6379/1
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
    networks:
      - excel-mapper-network
    depends_on:
      - redis

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    environment:
      - CHOKIDAR_USEPOLLING=true
      - REACT_APP_API_BASE_URL=http://localhost:8000/api
      - WDS_SOCKET_PORT=3000
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
    depends_on:
      - backend
    networks:
      - excel-mapper-network
    stdin_open: true
    tty: true

  frontend-dev:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "if [ ! -d node_modules/react-scripts ]; then npm ci; fi; npm start"
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - BROWSER=none
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
      - DISABLE_ESLINT_PLUGIN=true
      - GENERATE_SOURCEMAP=false
      - REACT_APP_API_BASE_URL=http://localhost:8000/api
      - WDS_SOCKET_PORT=3001
    volumes:
      - ./frontend:/app
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - frontend_dev_node_modules:/app/node_modules
    depends_on:
      - backend
    networks:
      - excel-mapper-network
    stdin_open: true
    tty: true

networks:
  excel-mapper-network:
    driver: bridge

volumes:
  frontend_dev_node_modules:
