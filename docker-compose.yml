

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - excel-mapper-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    # 8001 on the host, because 8000 belongs to the FactWise backend that embeds
    # this app as an iframe. The host port exists so the React dev server
    # (npm start, outside Docker) can proxy /api/ here — see frontend/package.json.
    ports:
      - "8001:8000"
    environment:
      - DEBUG=True
      - PORT=8000
      - ALLOWED_HOSTS=localhost,127.0.0.1,backend
      - SECRET_KEY=your-secret-key-for-local-development
      - DATABASE_URL=sqlite:///db.sqlite3
      - CORS_ALLOWED_ORIGINS=http://localhost:3000,http://127.0.0.1:3000,http://localhost:3001,http://127.0.0.1:3001
      - REDIS_URL=redis://redis:6379/1
      # Azure OCR credentials are provided via env_file below
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
      - ./backend/media:/app/media
      - ./backend/temp_downloads:/app/temp_downloads
      - ./backend/uploaded_files:/app/uploaded_files
      - ./backend/logs:/app/logs
    networks:
      - excel-mapper-network
    depends_on:
      - redis
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health/"]
      interval: 30s
      timeout: 10s
      retries: 5

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend.local
    # 3000 belongs to the FactWise frontend running outside Docker.
    ports:
      - "3001:80"
    depends_on:
      - backend
    networks:
      - excel-mapper-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  excel-mapper-network:
    driver: bridge
